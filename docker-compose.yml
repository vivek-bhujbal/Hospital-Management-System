services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@host.docker.internal:3306/hospital_management
      - JWT_SECRET=your_super_secret_key
      - JWT_ALGORITHM=HS256
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
