services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    restart: "no"
    env_file: ./backend/.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    build:
      context: ./backend
    restart: "no"
    # Super Admin credentials are owned by the backend environment file.
    env_file: ./backend/.env
    command: ["python", "-m", "app.services.super_admin_bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  reset:
    build:
      context: ./backend
    profiles: ["tools"]
    restart: "no"
    env_file: ./backend/.env
    command: ["python", "reset_db.py", "--confirm-database", "hospital_management"]
    depends_on:
      db:
        condition: service_healthy

  verify-clean-db:
    build:
      context: ./backend
    profiles: ["tools"]
    restart: "no"
    env_file: ./backend/.env
    command: ["python", "verify_clean_database.py"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Runtime mail/auth configuration is maintained with the backend service.
    env_file: ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file: ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
